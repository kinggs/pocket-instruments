# The terminal host (docs/TERMINAL.md, D123, D125): the instruments in a terminal, on the core's static
# library through the C ABI. Its own workspace, so the core's lock file and `make build` never
# see these dependencies; the root workspace excludes this folder.
[package]
name = "pocket-instruments"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Pocket Instruments: small instruments, played in a terminal."
publish = false
build = "build.rs"

[[bin]]
# One command for the family (D125 item 1). ⚠ The name is not cleared (O3): nothing is packaged.
name = "pocket-instruments"
path = "src/main.rs"

[lib]
name = "pi_term"
path = "src/lib.rs"

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["windows"] }
cpal = "0.18"

[features]
# cpal's own PipeWire host beside ALSA (--audio pipewire). Needs libpipewire and clang to build.
pipewire = ["cpal/pipewire"]

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
