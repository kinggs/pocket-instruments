<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rhythm in a terminal, pocket size</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 752px; height: 360px; box-sizing: border-box; background: #07060C; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', ui-monospace, monospace; font-weight: 800; font-size: 23.333px; line-height: 28px; color: #F2E8D0">
<div style="width: 672px; height: 280px; background: #14131F; display: flex; flex-direction: column; overflow: hidden; border-radius: 6px; white-space: pre">

<div style="height: 28px; padding: 0 14px; display: flex; justify-content: space-between">
<span>rhythm</span>
<div style="display: flex; gap: 28px"><span style="background: #F0B429; color: #14131F; padding: 0 14px">write</span><span><span style="color: #C9C2DD">step </span>13</span><span>120<span style="color: #C9C2DD"> bpm</span></span></div>
</div>

<div style="height: 28px; padding: 0 14px; display: flex; gap: 28px; align-items: flex-end; background: #0B0A12">
<sc-for list="{{ marks }}" as="m" hint-placeholder-count="16">
<div style="width: 14px; height: {{m.h}}px; background: {{m.c}}"></div>
</sc-for>
</div>

<div style="height: 196px; padding: 0 14px; display: flex; gap: 28px">
<div style="width: 364px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; align-content: start">
<sc-for list="{{ keys }}" as="k" hint-placeholder-count="16">
<div style="position: relative; height: 28px; box-sizing: border-box; border-style: solid; border-width: 0 14px; border-color: {{k.frame}}; background: {{k.field}}; color: {{k.ink}}; text-align: center">{{k.cap}}<span style="position: absolute; right: 3px; top: 10px; width: 8px; height: 8px; background: {{k.stitch}}"></span></div>
</sc-for>
</div>

<div style="width: 42px; display: flex; gap: 14px">
<div style="position: relative; width: 14px; height: 196px"><div style="position: absolute; left: 6px; top: 0; width: 2px; height: 196px; background: #6E6A92"></div><div style="position: absolute; left: 0; top: 56px; width: 14px; height: 28px; background: #F2E8D0"></div></div>
<div style="position: relative; width: 14px; height: 196px"><div style="position: absolute; left: 6px; top: 0; width: 2px; height: 196px; background: #6E6A92"></div><div style="position: absolute; left: 0; top: 112px; width: 14px; height: 28px; background: #F2E8D0"></div></div>
</div>

<div style="width: 182px; display: flex; flex-direction: column">
<sc-for list="{{ fkeys }}" as="f" hint-placeholder-count="7">
<div style="height: 28px; box-sizing: border-box; border-left: 14px solid {{f.band}}; background: {{f.face}}; color: {{f.ink}}; padding-left: 14px; display: flex; gap: 14px"><span style="color: {{f.capInk}}">{{f.cap}}</span><span>{{f.word}}</span></div>
</sc-for>
</div>
</div>

<div style="height: 28px; padding: 0 14px; display: flex; gap: 28px; color: #C9C2DD">
<span><span style="color: #F2E8D0">?</span> keys</span>
<span><span style="color: #F2E8D0">:</span> command</span>
<span><span style="color: #F2E8D0">esc</span> let go</span>
<span><span style="color: #F2E8D0">^q</span> quit</span>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":752,"height":360}}'>
class Component extends DCLogic {
renderVals() {
const T = { ground: '#14131F', tile: '#2B2942', ecru: '#F2E8D0', ochre: '#F0B429', madder: '#F0654A', sky: '#8FAAF7', lilac: '#C9C2DD', thread: '#6E6A92' };
const caps = '1234qwerasdfzxcv'.split('');
const lit = [0, 4, 8, 12], stitch = [2, 4, 6, 10, 12, 14], play = 12;
const keys = caps.map((cap, i) => {
const on = lit.includes(i);
const field = on ? T.ecru : T.tile;
return { cap, field, frame: i === play ? T.ochre : field, ink: on ? T.ground : T.ecru, stitch: stitch.includes(i) ? (on ? T.ground : T.ecru) : 'transparent' };
});
const marks = caps.map((_, i) => ({ h: i === play ? 28 : (i % 4 === 0 ? 14 : 7), c: i === play ? T.ochre : T.thread }));
const fk = (cap, word, colour, latched) => ({ cap, word, band: colour, face: latched ? colour : T.ground, ink: latched ? T.ground : T.ecru, capInk: latched ? T.ground : T.lilac });
const fkeys = [fk('7', 'sound', T.madder, false), fk('8', 'pattern', T.ochre, false), fk('9', 'bpm', T.sky, false), fk('u', 'function', T.ecru, false), fk('i', 'fx', T.ecru, false), fk('o', 'play', T.ecru, true), fk('p', 'write', T.ecru, true)];
return { keys, marks, fkeys };
}
}
</script>
</body>
</html>
